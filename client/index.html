<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary SEO -->
    <title>SLICE STORM — Arcade Fruit Slicing Game</title>
    <meta
      name="description"
      content="Slice Storm is a fast, free arcade fruit slicing game. Swipe to slice fruit, build combos, dodge the bombs and climb the leaderboard."
    />
    <meta
      name="keywords"
      content="fruit slicing game, arcade game, slice storm, ninja fruit game, browser game, free online game"
    />
    <meta name="author" content="Slice Storm" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- TODO: replace with your real production URL -->
    <link rel="canonical" href="https://www.example.com/" />

    <!-- Theme / PWA -->
    <meta name="theme-color" content="#FFE5A3" />
    <meta name="color-scheme" content="light" />
    <meta name="application-name" content="Slice Storm" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Slice Storm" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Slice Storm" />
    <meta property="og:title" content="SLICE STORM — Arcade Fruit Slicing Game" />
    <meta
      property="og:description"
      content="Swipe to slice fruit, chain combos and dodge the bombs. Free to play in your browser."
    />
    <meta property="og:url" content="https://www.example.com/" />
    <meta property="og:image" content="https://www.example.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Slice Storm gameplay: fruit being sliced by a katana" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SLICE STORM — Arcade Fruit Slicing Game" />
    <meta
      name="twitter:description"
      content="Swipe to slice fruit, chain combos and dodge the bombs. Free to play in your browser."
    />
    <meta name="twitter:image" content="https://www.example.com/og-image.png" />

    <!-- Performance: connect early to font hosts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts: one request, non-render-blocking, with display=swap -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Rubik:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&family=Titan+One&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Rubik:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&family=Titan+One&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Rubik:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&family=Titan+One&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      />
    </noscript>

    <!-- Critical CSS: no white flash, game-friendly touch behaviour, splash -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #ffe5a3;
        color: #252525;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none; /* stop pull-to-refresh while swiping */
      }
      body {
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI",
          Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }
      /* Prevent text selection / long-press menus during gameplay */
      canvas {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      /* Splash shown until React mounts (React replaces #root contents) */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #ffe5a3;
      }
      .boot-title {
        font-family: "Titan One", Impact, "Arial Black", sans-serif;
        font-size: clamp(32px, 9vw, 56px);
        letter-spacing: 0.04em;
        text-shadow: 3px 3px 0 #fff;
        margin: 0;
      }
      .boot-bar {
        width: min(220px, 60vw);
        height: 14px;
        border: 3px solid #252525;
        border-radius: 999px;
        background: #fff;
        overflow: hidden;
      }
      .boot-bar::after {
        content: "";
        display: block;
        height: 100%;
        width: 40%;
        background: #ff5a65;
        border-radius: 999px;
        animation: boot-slide 1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(260%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Slice Storm",
        "description": "A fast arcade fruit slicing game. Swipe to slice, build combos and avoid bombs.",
        "genre": "Arcade",
        "gamePlatform": "Web Browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "url": "https://www.example.com/",
        "image": "https://www.example.com/og-image.png",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>

  <body>
    <div id="root">
      <!-- Pre-render splash: visible instantly, replaced when React mounts -->
      <div class="boot" role="status" aria-live="polite">
        <h1 class="boot-title">SLICE STORM</h1>
        <div class="boot-bar" aria-hidden="true"></div>
        <span style="position:absolute;left:-9999px">Loading game…</span>
      </div>
    </div>

    <noscript>
      <div
        style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#ffe5a3;font-family:system-ui,sans-serif;font-weight:700"
      >
        Slice Storm needs JavaScript to run. Please enable JavaScript and reload
        the page.
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
